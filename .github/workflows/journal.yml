name: Kalvium Daily Journal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  submit-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Google authentication
        env:
          PLAYWRIGHT_AUTH: ${{ secrets.PLAYWRIGHT_AUTH }}
        run: |
          if [ -z "$PLAYWRIGHT_AUTH" ]; then
            echo "::error::PLAYWRIGHT_AUTH secret is not set or empty. Please add it under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$PLAYWRIGHT_AUTH" | base64 --decode > auth.json
          if [ ! -s auth.json ]; then
            echo "::error::auth.json is empty after decoding PLAYWRIGHT_AUTH. Please check the secret value."
            exit 1
          fi

      - name: Submit daily journal
        run: node submit.js

      - name: Upload error screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: error.png
          if-no-files-found: ignore
